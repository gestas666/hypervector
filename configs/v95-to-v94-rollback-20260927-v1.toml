# Approval: docs/live-approvals/v95-to-v94-rollback-20260927-v1.json. Start only through a drained,
# archived, flat and order-free boundary; this file grants no authority.
# V94 review actions (docs/plans/2026-09-24-v94-review-actions.md, approved by
# the operator 2026-09-24 from docs/reviews/2026-09-24-v93-full-review.md).
# V93's exit policy v2 on every route, plus:
# - Donchian 20/10 routes (SOL, SNDK, BRENTOIL, TSLA) run the strong-short
#   identity: a short opens only when the close is at least 1 ATR20 beyond the
#   prior 20-bar low. Longs, exits and stops are unchanged.
# - The Donchian stop-loss budget is 0.6% of the account value that sizes the
#   entry, including a 20 bps cost allowance (about $29 at $4,831), so it
#   compounds with equity. BTC and ETH keep the fixed $25.
# - Once the +2R floor arms, v2 routes raise the venue stop to the software
#   floor: the further of entry + 25 bps and entry + 0.5R in the trade's favour
#   (V93 raised it to entry + 25 bps only). A raise is sent only while it rests
#   on the protective side of a fresh quote, and exhausted raise attempts
#   surface as a protection warning. BTC's fixed 60/60 bracket takes profit at
#   +1R, so its floor never arms and it keeps the V93 raise target.
# - HYPE and SPCX band20 are watch-only (no executable scope). HYPE's envelope
#   shrinks to 1.3% margin and $500 so re-arming it cannot restore a
#   half-bankroll slot. HYPE keeps its long-only side override: the frozen
#   alignment contract requires it for recipe-honoring exits, and it is inert
#   without an executable symbol.
# - BTC's asset stop_bps matches its provider's 60 bps (the asset value is inert).
# Gaps, funding and fills outside the modeled interval can exceed the budget.
