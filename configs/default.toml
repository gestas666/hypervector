# Phase 1 research defaults (SRS_HV1_*)
symbol = "BTC"
timeframe = "1m"
lookback_days = 90
# floor 30, promo 180 supported via CLI/config override
backfill_priority = ["binance", "bybit"]
strict_hl_only = false
fee_model = "hl_taker_default"
init_cash = 10000

# Costs (research approx; Nautilus Phase 2 for full realism)
# Dual-path: research [costs] stays static; paper uses fee_tier schedule in CostProvider.
[costs]
taker_fee = 0.00035
slippage_bps = 2.0
funding_rate_8h = 0.0001

# Paper live-feed (HL tier schedule + live funding; does not replace [costs])
# Phase 4a: preferred fill is l2_walk_v1 when book fresh; falls back to bar_close.
# Phase 4b: mode = "shadow" — mainnet-honest order intents, no venue submit;
# ledger stays under data/paper/. Use mode = "paper" for offline-compat synthetic.
[paper]
mode = "shadow"  # shadow | paper — never live submit
sandbox_enabled = false
funding_poll_secs = 60
fill_model_id = "bar_close_slippage_v1"
preferred_fill_model = "l2_walk_v1"
max_book_age_ms = 3000
# Metalabel defaults off. Hypervelocity forces any active model to observe-only;
# other strategies retain the legacy filter switch below.
# Bundle: data/models/metalabel/ (or HYPERVECTOR_METALABEL_ROOT).
# Enable: paper-run --metalabel [--metalabel-min-p 0.5] [--no-metalabel-filter]
metalabel_enabled = false
metalabel_min_p = 0.5
metalabel_filter = true
fee_tier = 0
assume_taker = true
slippage_bps = 2.0

# Live execution (Phase 4b-live). Paper/shadow never places venue orders.
# Secrets env (required to start live-run when enabled+armed):
#   HYPERVECTOR_HL_WALLET_ADDRESS=
#   HYPERVECTOR_HL_API_PRIVATE_KEY=
[live]
enabled = false
max_notional_usd = 50.0
# require CLI --i-accept-live-risk in addition to enabled=true
require_arm_flag = true
# ledger under data/live/decisions (never paper)

# Risk: 1%–5% of equity at risk, scaled by conviction [0,1]
[risk]
risk_pct_min = 0.01
risk_pct_max = 0.05
default_conviction = 0.5
max_size_frac = 1.0

# TP/SL modes: fixed_rr | atr | trail
[exits]
mode = "atr"
sl_pct = 0.01
rr = 2.0
atr_length = 14
sl_atr_mult = 1.5
trail_atr_mult = 2.0

# Faithful Hypervelocity is a fixed backend contract. These values supersede
# the generic [risk], [exits], and taker-fill defaults only for its strategy IDs.
[hypervelocity]
symbols = ["BTC"]
timeframe = "1m"
strategy_ids = ["hypervelocity_1m_scalper_long", "hypervelocity_1m_scalper_short"]
strategy_id = "hypervelocity_1m_scalper"
position_mode = "one_way"
max_positions_per_symbol = 1
direction_mode = "regime_bidirectional"
allow_reversal_while_open = false
switch_after_exit = true
allowed_states = ["TREND_UP", "TREND_DOWN", "BREAKOUT_DIRECTION_CONFIRMED"]
blocked_states = ["RANGE", "TRANSITION", "UNKNOWN"]
margin_fraction = 0.70
leverage = 40.0
target_margin_pct = 8.0
target_price_fraction = 0.002
stop_policy = "none_observed"
open_position_range_policy = "hold_until_target"

[hypervelocity.execution]
order_type = "limit"
time_in_force = "post_only"
fill_rule = "through_one_tick"
fill_model = "post_only_limit_through_v1"
price_tick_mode = "hyperliquid_dynamic"
entry_ttl_seconds = 300.0

[hypervelocity.venue]
name = "hyperliquid"
network = "mainnet"
instrument_spec_source = "public_meta"
size_decimals = 5
venue_max_leverage = 40.0

[hypervelocity.costs]
fee_source = "hyperliquid_base_tier"
fee_tier = 0
maker_fee_rate = 0.00015
taker_fee_rate = 0.00045
slippage_bps = 0.0
funding_source = "live_meta_and_asset_contexts"
funding_refresh_seconds = 60.0
funding_accrual = "hourly_boundary"

[hypervelocity.ml]
mode = "off"
may_filter = false
may_scale = false

[hypervelocity.regime]
execution_timeframe = "1m"
primary_timeframe = "5m"
context_timeframe = "15m"
context_is_hard_gate = false
ema_fast = 5
ema_slow = 13
warmup_bars = 60
structure_lookback = 120
trend_strength_percentile = 70.0
range_strength_percentile = 40.0
minimum_trend_gap_bps = 0.5
choppiness_range_threshold = 75.0
choppiness_length = 14
coiling_width_bps = 1.0
breakout_lookback = 90
breakout_clearance_bps = 8.0
breakout_volume_multiple = 2.5
breakout_volume_lookback = 20
