profile = "multi_asset_eth_pullback_forward_observer_v1"
network = "mainnet"
margin_mode = "isolated"
maximum_positions = 1

[runtime]
cohort_ledger = "data/observe/eth_pullback_forward_observer/decisions.jsonl"
stop_file = "data/observe/eth_pullback_forward_observer/STOP"
poll_seconds = 15.0
lookback_days = 14

[[assets]]
symbol = "ETH"
sides = ["long", "short"]
leverage = 5.0
venue_max_leverage = 25.0
margin_fraction = 0.03
max_notional_usd = 750.0
market_slippage_cap_fraction = 0.01
stop_bps = 60.0
maximum_hold_seconds = 43200

[[providers]]
strategy_id = "eth_breakout_precompression_pullback_bidirectional_v1"
symbols = ["ETH"]
sides = ["long", "short"]
priority = 10
timeframe = "1m"
maximum_entry_delay_seconds = 60
execution_symbols = ["ETH"]
execution = { entry_liquidity = "taker_ioc", stop_policy = "fixed_bps", stop_bps = 60.0, target_policy = "none", maximum_hold_seconds = 43200 }
