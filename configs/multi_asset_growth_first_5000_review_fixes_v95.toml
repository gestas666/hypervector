# V95 review fixes (review item B2). Every kept route runs V94's values
# unchanged: the BTC liquidity sweep (fixed 60/60 bracket, $25 stop budget), the
# ETH range-onset long (fixed 60 bps, $25 stop budget) and the SOL, SNDK,
# BRENTOIL and TSLA Donchian 20/10 strong-short routes (stop budget 0.6% of the
# entry account value plus a 20 bps cost allowance; the venue stop rises to the
# +0.5R software floor once the +2R floor arms). Exit policy v2 on every route.
# - HYPE and xyz:SPCX are removed, with their watch-only providers
#   (hype_breakout_compression_alignment_bidirectional_v2 and
#   hourly_band20_reentry_atr20_bidirectional_v1) and every override table that
#   named them. Neither had an executable scope in V94, so no execution scope
#   retires; the transition still requires both markets flat and order-free.
# - Source fixes that ship with V95 (no profile values): the supervisor can
#   resume after a host restart (opt-in through the plist environment, default
#   off); the backend stops within seconds of SIGTERM; the start probe and the
#   engine preflight refuse a venue maximum leverage only below the requested
#   leverage; live mode requires the stop file beside the cohort ledger and the
#   pre-arm gate checks that every executable provider resolves a collector;
#   checkpoint I/O is cut; the cockpit STOP/LOCK line follows acknowledged stop
#   raises.
# Gaps, funding and fills outside the modeled interval can exceed the budget.
profile = "multi_asset_growth_first_5000_review_fixes_v95"
network = "mainnet"
margin_mode = "isolated"
maximum_positions = 8

[runtime]
cohort_ledger = "data/live/bidirectional_cohort/decisions.jsonl"
stop_file = "data/live/bidirectional_cohort/STOP"
transition_approval = "docs/live-approvals/v94-to-v95-review-fixes-20260927-v1.json"
poll_seconds = 15.0
lookback_days = 14

[[assets]]
symbol = "BTC"
sides = ["long", "short"]
leverage = 10.0
venue_max_leverage = 40.0
margin_fraction = 0.011
max_notional_usd = 700.0
market_slippage_cap_fraction = 0.01
stop_bps = 60.0
maximum_hold_seconds = 86400
entry_slippage_cap_fraction = 0.002

