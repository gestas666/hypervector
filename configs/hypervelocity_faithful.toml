# Audit profile for the backend-enforced Hypervelocity contract.
# The Python contract remains authoritative; this file makes effective values
# reviewable and supplies a stable reference for external orchestration.
profile = "hypervelocity_faithful_v1"
symbol = "BTC"
timeframe = "1m"
strategy_id = "hypervelocity_1m_scalper"
research_strategy_ids = ["hypervelocity_1m_scalper_long", "hypervelocity_1m_scalper_short"]
position_mode = "one_way"
max_positions_per_symbol = 1
direction_mode = "regime_bidirectional"
allow_reversal_while_open = false
switch_after_exit = true

[entry]
allowed_states = ["TREND_UP", "TREND_DOWN", "BREAKOUT_DIRECTION_CONFIRMED"]
blocked_states = ["RANGE", "TRANSITION", "UNKNOWN"]
confidence_is_gate = false

[allocation]
margin_fraction = 0.70
leverage = 40.0
notional_fraction = 28.0

[exit]
mode = "single_fixed_target"
target_margin_pct = 8.0
target_price_fraction = 0.002
stop_policy = "none_observed"
split_exit = false
open_position_range_policy = "hold_until_target"

[execution]
order_type = "limit"
time_in_force = "post_only"
fill_rule = "public_l2_trade_event_tape"
fill_model = "nautilus_event_v1"
legacy_comparator = "legacy_bar_through_v1"
legacy_fill_rule = "through_one_tick"
price_tick_mode = "hyperliquid_dynamic"
entry_ttl_seconds = 300.0
expired_entry_rearm_policy = "regime_reset"
same_direction_reentry_policy = "regime_reset"
reentry_cooldown_bars = 1
paper_submit_enabled = false
live_enabled = false
submit_latency_ms = 50
cancel_latency_ms = 50
update_latency_ms = 50
max_event_age_ms = 3000
restart_queue_policy = "requeue_behind_displayed_liquidity"

[orderbook]
archive_enabled = true
archive_depth_levels = 20

[venue]
name = "hyperliquid"
network = "mainnet"
margin_mode = "isolated"
live_canary_max_notional_usd = 3360.0
instrument_spec_source = "public_meta"
size_decimals = 5
venue_max_leverage = 40.0

[costs]
fee_source = "hyperliquid_base_tier"
fee_tier = 0
maker_fee_rate = 0.00015
taker_fee_rate = 0.00045
slippage_bps = 0.0
funding_source = "live_meta_and_asset_contexts"
funding_refresh_seconds = 60.0
funding_accrual = "hourly_boundary"

[model]
mode = "observe"
may_filter = false
may_scale = false
installed_candidate = "hypervelocity_directional_runtime_20260725T081458Z"
long_bundle = "data/models/metalabel/candidates/hypervelocity-l2-runtime-uptrend-long-20260725T081458Z"
short_bundle = "data/models/metalabel/candidates/hypervelocity-l2-runtime-downtrend-short-20260725T081458Z"

[runtime]
mode = "shadow"
shadow_execution_model = "nautilus_event_v1"
export_path = "data/exports/uptrend_hypervelocity_1m_scalper_long_784548f1"
lookback_days = 30
strict_hl_only = true
poll_interval_seconds = 10.0
metalabel_mode = "observe"

[regime]
execution_timeframe = "1m"
primary_timeframe = "5m"
context_timeframe = "15m"
context_is_hard_gate = false
ema_fast = 5
ema_slow = 13
warmup_bars = 60
structure_lookback = 120
trend_strength_percentile = 70.0
range_strength_percentile = 40.0
minimum_trend_gap_bps = 0.5
choppiness_range_threshold = 75.0
choppiness_length = 14
coiling_width_bps = 1.0
breakout_lookback = 90
breakout_clearance_bps = 8.0
breakout_volume_multiple = 2.5
breakout_volume_lookback = 20
