[package]
name = "hypervector-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only condensed financial ops terminal for hypervector"

[lib]
name = "hypervector_tui"
path = "src/lib.rs"

[[bin]]
name = "hypervector-tui"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = "0.28"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tui-big-text = "0.7"
throbber-widgets-tui = "0.8"
palette = "0.7"

[dev-dependencies]
tempfile = "3"
