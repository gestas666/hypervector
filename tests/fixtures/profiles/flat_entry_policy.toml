profile = "fixture_flat_entry_policy"
network = "mainnet"
margin_mode = "isolated"
maximum_positions = 4

[runtime]
cohort_ledger = "data/live/bidirectional_cohort/decisions.jsonl"
stop_file = "data/live/bidirectional_cohort/STOP"
poll_seconds = 15.0
lookback_days = 14

[[assets]]
symbol = "BTC"
sides = ["long", "short"]
leverage = 5.0
venue_max_leverage = 40.0
margin_fraction = 0.03
max_notional_usd = 25.0
market_slippage_cap_fraction = 0.01
stop_bps = 80.0
maximum_hold_seconds = 28800

[[assets]]
symbol = "ETH"
sides = ["long", "short"]
leverage = 5.0
venue_max_leverage = 25.0
margin_fraction = 0.03
max_notional_usd = 25.0
market_slippage_cap_fraction = 0.01
stop_bps = 80.0
maximum_hold_seconds = 28800

[[assets]]
symbol = "SOL"
sides = ["long", "short"]
leverage = 5.0
venue_max_leverage = 20.0
margin_fraction = 0.03
max_notional_usd = 75.0
market_slippage_cap_fraction = 0.01
stop_bps = 80.0
maximum_hold_seconds = 28800

[[assets]]
symbol = "HYPE"
sides = ["long", "short"]
leverage = 5.0
venue_max_leverage = 10.0
margin_fraction = 0.03
max_notional_usd = 25.0
market_slippage_cap_fraction = 0.01
stop_bps = 80.0
maximum_hold_seconds = 28800

[[providers]]
strategy_id = "test_trend_5m"
sizing_overrides = { SOL = { margin_fraction = 0.03, max_notional_usd = 25.0 } }
symbols = ["BTC", "ETH", "SOL", "HYPE"]
sides = ["long", "short"]
priority = 10
timeframe = "5m"
maximum_entry_delay_seconds = 60
execution_symbols = ["BTC", "ETH", "SOL", "HYPE"]
execution = { entry_liquidity = "taker_ioc", stop_policy = "structural_clamped_bps", minimum_stop_bps = 20.0, maximum_stop_bps = 75.0, target_policy = "reward_risk", target_r_multiple = 3.0, maximum_hold_seconds = 86400 }

[[providers]]
strategy_id = "test_breakout_1m"
symbols = ["BTC", "ETH", "SOL", "HYPE"]
sides = ["long", "short"]
priority = 20
timeframe = "1m"
maximum_entry_delay_seconds = 60
execution_symbols = []
execution = { entry_liquidity = "taker_ioc", stop_policy = "fixed_bps", stop_bps = 60.0, target_policy = "none", maximum_hold_seconds = 172800 }

[[providers]]
strategy_id = "test_mirror_1m"
symbols = ["BTC"]
sides = ["long", "short"]
priority = 30
timeframe = "1m"
maximum_entry_delay_seconds = 60
execution_symbols = ["BTC"]
execution = { entry_liquidity = "taker_ioc", stop_policy = "fixed_bps", stop_bps = 80.0, target_policy = "fixed_bps", target_bps = 26.6666666667, maximum_hold_seconds = 86400, safety_stop_overlay = true }

[[providers]]
strategy_id = "test_loose_1m"
symbols = ["HYPE"]
sides = ["long", "short"]
priority = 35
position_policy = "flat_entry_only"
timeframe = "1m"
maximum_entry_delay_seconds = 60
execution_symbols = ["HYPE"]
execution = { entry_liquidity = "taker_ioc", stop_policy = "fixed_bps", stop_bps = 80.0, target_policy = "none", maximum_hold_seconds = 3600 }

[[providers]]
strategy_id = "test_fade_1m"
symbols = ["HYPE"]
sides = ["long", "short"]
priority = 40
timeframe = "1m"
maximum_entry_delay_seconds = 60
execution_symbols = ["HYPE"]
execution = { entry_liquidity = "taker_ioc", stop_policy = "fixed_bps", stop_bps = 80.0, target_policy = "none", maximum_hold_seconds = 28800, maximum_hold_policy = "extend_while_regime_supported", hard_maximum_hold_seconds = 86400 }
